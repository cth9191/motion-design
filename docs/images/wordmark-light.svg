<title id="title">Motion Design</title>
<desc id="desc">A custom Motion Design wordmark with a blue ribbon symbol and subtle moving trails.</desc>
<style>
.trail-one{animation:drift 4s ease-in-out infinite}
.trail-two{animation:drift 4s .18s ease-in-out infinite}
@keyframes drift{0%,65%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}}
@media(prefers-reduced-motion:reduce){.trail-one,.trail-two{animation:none}}
</style>
